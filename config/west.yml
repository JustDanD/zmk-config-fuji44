manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: ergohaven
      url-base: https://github.com/ergohaven

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    - name: ergohaven-zmk
      remote: ergohaven
      revision: main

    - name: ergohaven-zmk-qube
      remote: ergohaven
      revision: eh

  self:
    path: config